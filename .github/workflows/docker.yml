# En cada push a main y en cada pull request: corre el lint y los tests (también contra MySQL 8).
# La IMAGEN se publica solo cuando se crea un tag de versión (vX.Y.Z): ahí, si todo pasa, se sube
# a GitHub Container Registry. Napsis despliega esa versión (ver deploy/RELEASE.md). Un push común
# a main no construye ni publica nada.
name: Imagen Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: solo-para-ci-no-es-una-clave-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.17.1
      # Imports sin usar, errores de sintaxis y bugs probables (ver ruff.toml).
      - run: ruff check .
      # Que no haya cambios de modelos sin su migración.
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --parallel

  # La base de producción es MySQL 8: la suite también tiene que pasar ahí (las migraciones,
  # la collation y el modo estricto se comportan distinto que en SQLite).
  tests-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: napsis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_DB: napsis
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test --noinput

  imagen:
    needs: [tests, tests-mysql]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aluskies/implementador-napsis
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
