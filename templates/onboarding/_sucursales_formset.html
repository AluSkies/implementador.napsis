{% load static %}
<div data-sucursales>
    {{ formset.management_form }}
    {% if formset.non_form_errors %}<ul class="field-error">{% for error in formset.non_form_errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
    <div data-lista>
        {% for f in formset %}{% include "onboarding/_sucursal_tarjeta.html" %}{% endfor %}
    </div>
    <template data-vacia>{% include "onboarding/_sucursal_tarjeta.html" with f=formset.empty_form %}</template>
    <div class="actions">
        <button type="button" class="btn success icono" data-agregar>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Agregar sucursal
        </button>
    </div>
</div>
<script src="{% static 'sucursales_formset.js' %}" defer></script>
