{% extends "onboarding/base_wizard.html" %}
{% block step_content %}
<p class="muted">Cargá las sucursales de la empresa. Dejá en blanco las que no correspondan.</p>
<form method="post">
    {% csrf_token %}
    {{ formset.management_form }}
    {% for f in formset %}
        <fieldset>
            <legend>Sucursal {{ forloop.counter }}</legend>
            {{ f.as_p }}
        </fieldset>
    {% endfor %}
    <div class="actions">
        <button class="btn" type="submit">Continuar</button>
    </div>
</form>
{% endblock %}
