databases:
  - name: napsis-portal-db
    plan: free
    databaseName: napsis_portal
    user: napsis

services:
  - type: web
    name: napsis-portal
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SITE_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: POSTGRES_DB
        fromDatabase:
          name: napsis-portal-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: napsis-portal-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: napsis-portal-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: napsis-portal-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: napsis-portal-db
          property: port
