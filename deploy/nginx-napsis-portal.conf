# Copiar a /etc/nginx/sites-available/napsis-portal y linkear:
#   sudo cp deploy/nginx-napsis-portal.conf /etc/nginx/sites-available/napsis-portal
#   sudo ln -s /etc/nginx/sites-available/napsis-portal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reemplazá "tu-dominio-o-ip" por el hostname/IP real de la máquina.

server {
    listen 80;
    server_name tu-dominio-o-ip;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/napsis-portal/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /opt/napsis-portal/media/;
    }

    location / {
        proxy_pass http://unix:/run/napsis-portal/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
