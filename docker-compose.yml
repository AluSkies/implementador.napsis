# Una sola instancia de la app. La base MySQL es la que ya tiene Napsis (no se
# levanta una acá): se configura por MYSQL_* en .env.docker.
services:
  app:
    build: .
    # Sin valor por defecto a propósito: hay que fijar una versión inmutable (vX.Y.Z), nunca `latest`.
    image: ${NAPSIS_IMAGE:?Definir NAPSIS_IMAGE en .env, ej. NAPSIS_IMAGE=ghcr.io/aluskies/implementador-napsis:v1.0.0}
    env_file:
      - .env.docker
      # Correo saliente (SMTP): lo configura deploy. Opcional: sin él la app arranca, pero
      # no envía mails. Requiere Docker Compose >= 2.24 por `required: false`.
      - path: .env.mail
        required: false
    # Solo accesible desde el propio host: el proxy reverso de Napsis es quien
    # recibe el tráfico público (80/443) y lo reenvía acá. Cambialo si el proxy
    # corre en otra máquina o red de Docker.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      # Pide /salud/ con el Host correcto (ver docker/healthcheck.py): comprueba que la app
      # atiende Y que llega a la base de datos, no solo que el puerto esté abierto.
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  media:
    # Nombre fijo: sin esto Docker lo llama <carpeta>_media, y si alguien mueve o renombra la
    # carpeta del proyecto se crearía un volumen nuevo y vacío sin avisar.
    name: napsis_media
  logs:
    # Log de errores de la app (errores.log): en un volumen para que sobreviva a los redeploys.
    name: napsis_logs
